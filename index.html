<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101512">
  <meta name="description" content="Public GitHub projects by BlackBearRedux.">
  <title>Projects · BlackBearRedux</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./projects.js" defer></script>
</head>
<body>
  <header class="shell masthead">
    <span class="handle"><span aria-hidden="true">&gt; </span>BlackBearRedux</span>
    <a class="profile-link" href="https://github.com/BlackBearRedux">GitHub profile</a>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="intro-title">
      <div class="hero-copy">
        <h1 id="intro-title">Projects</h1>
        <p class="intro">My public projects on GitHub</p>
        <a class="browse" href="#repositories">Browse repositories</a>
      </div>
      <div class="profile">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/360515515?v=4&amp;s=400" width="184" height="184" alt="BlackBearRedux’s GitHub avatar">
        <span>@BlackBearRedux</span>
      </div>
    </section>
    <section id="repositories" class="repository-panel" aria-label="Public repositories">
      <div class="list-header"><h2>Repositories</h2><span id="status" role="status">Loading…</span></div>
      <ul id="projects" class="projects"></ul>
      <noscript><p>View the <a href="https://github.com/BlackBearRedux?tab=repositories">repository list on GitHub</a>.</p></noscript>
    </section>
  </main>
</body>
</html>
